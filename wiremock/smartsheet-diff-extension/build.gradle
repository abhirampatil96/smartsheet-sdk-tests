plugins {
    id 'java'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.smartsheet'
version '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.github.tomakehurst', name: 'wiremock-standalone', version: '3.0.1'
    implementation group: 'net.javacrumbs.json-unit', name: 'json-unit', version: '3.2.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.15.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.15.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.15.2'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-core', version: '4.0.3'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '4.0.3'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

shadowJar {
    archiveBaseName = 'diff-extension'
    archiveClassifier = ''
    archiveVersion = ''

    relocate "net.javacrumbs.json-unit", 'diffextension.net.javacrumbs.json-unit'
    relocate "com.fasterxml.jackson.core", 'diffextension.com.fasterxml.jackson.core'
}

// Task to copy specific dependencies to sdk_tests_package/libs folder
task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into '../../sdk_tests_package/libs'
    include '**/wiremock-standalone-*.jar'
    include '**/jaxb-api-*.jar'
    include '**/jaxb-core-*.jar'
    include '**/jaxb-impl-*.jar'

    // Rename jaxb-impl to jaxb-runtime for consistency with requirements
    rename 'jaxb-impl-(.*).jar', 'jaxb-runtime-$1.jar'

    doFirst {
        // Create the target directory if it doesn't exist
        file('../../sdk_tests_package/libs').mkdirs()
    }
}

// Task to copy the built diff-extension jar to sdk_tests_package/libs folder
task copyBuiltJar(type: Copy, dependsOn: shadowJar) {
    from 'build/libs'
    into '../../sdk_tests_package/libs'
    include 'diff-extension.jar'

    doFirst {
        // Create the target directory if it doesn't exist
        file('../../sdk_tests_package/libs').mkdirs()
    }
}

// Task to copy specific dependencies to local libs folder (for backwards compatibility)
task copyDependenciesLocal(type: Copy) {
    from configurations.runtimeClasspath
    into 'libs'
    include '**/wiremock-standalone-*.jar'
    include '**/jaxb-api-*.jar'
    include '**/jaxb-core-*.jar'
    include '**/jaxb-impl-*.jar'

    // Rename jaxb-impl to jaxb-runtime for consistency with requirements
    rename 'jaxb-impl-(.*).jar', 'jaxb-runtime-$1.jar'
}

// Task to copy the built diff-extension jar to local libs folder (for backwards compatibility)
task copyBuiltJarLocal(type: Copy, dependsOn: shadowJar) {
    from 'build/libs'
    into 'libs'
    include 'diff-extension.jar'
}

// Main task to build and package all required dependencies
task packageLibs(dependsOn: [clean, shadowJar, copyDependenciesLocal, copyBuiltJarLocal]) {
    description = 'Builds the extension and copies all required dependencies to libs folder'
    group = 'build'
}

// Ensure copyBuiltJarLocal runs after copyDependenciesLocal
copyBuiltJarLocal.mustRunAfter copyDependenciesLocal

// Make shadowJar automatically copy to sdk_tests_package/libs
shadowJar.finalizedBy copyDependencies, copyBuiltJar
copyBuiltJar.mustRunAfter copyDependencies
